<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Pharmacy Admin Login</h2>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="Email Address"
                class="w-full p-3 border border-gray-300 rounded-lg">
            <input type="password" id="password" placeholder="Password"
                class="w-full p-3 border border-gray-300 rounded-lg">
            <button id="login-btn"
                class="w-full bg-blue-600 text-white font-semibold p-3 rounded-lg hover:bg-blue-700 transition">Login</button>
        </div>
        <p id="status-message" class="text-center mt-4 text-sm text-red-500"></p>
        <p class="text-center mt-4 text-sm text-gray-600">
            Don't have an account? <a href="register.html" class="text-blue-600 hover:underline">Register here</a>.
        </p>
    </div>

    <script type="module" src="../js/login.js"></script>
</body>

</html>
